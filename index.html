<title>ZenZac — calm, routines &amp; play</title>
<meta name="description" content="ZenZac is a calm toolkit for children with ADHD, autism or both — a profile quiz, house rules, breathing, routines, games, a feelings journal and a 65-entry compendium of practical tools and guides.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/theme.css">
<script>
  /* Apply the saved palette before first paint, so there is no flash. */
  try {
    var zz = JSON.parse(localStorage.getItem("zenzac.v1") || "{}");
    if (zz && zz.settings) {
      if (zz.settings.theme) document.documentElement.setAttribute("data-theme", zz.settings.theme);
      if (zz.settings.bigText) document.documentElement.setAttribute("data-bigtext", "on");
      if (zz.settings.motion === "calm") document.documentElement.setAttribute("data-motion", "calm");
    }
  } catch (e) {}
</script>
